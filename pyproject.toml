[project]
name = "xpars"
version = "0.1.0"
description = "Clean-room reflected/DOM XSS tarayici (xss0r davranisindan turetildi)"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
xpars = "xpars.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xpars"]

[tool.setuptools.package-data]
xpars = ["data/*.txt"]
